name: mind

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: brain
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - brain-postgres-data:/var/lib/postgresql/data
      - ./products/brain/docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      dockerfile: products/brain/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgresql+psycopg://brain:brain@postgres:5432/brain
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-10}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-30000}
      DATABASE_LOCK_TIMEOUT_MS: ${DATABASE_LOCK_TIMEOUT_MS:-5000}
      LOCAL_BEARER_TOKEN: ${LOCAL_BEARER_TOKEN:-brain-local-dev}
      LOCAL_ORGANIZATION_ID: ${LOCAL_ORGANIZATION_ID:-35982da3-60ae-5eea-b46a-088c3cc0f278}
      LOCAL_PRINCIPAL_ID: ${LOCAL_PRINCIPAL_ID:-7f180c45-c2f9-5f9d-b715-bf68f4ced724}
      LOCAL_GROUP_IDS: ${LOCAL_GROUP_IDS:-["8bde0934-4daa-5afa-a9c3-24e849557486"]}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    build:
      context: .
      dockerfile: products/brain/Dockerfile
      target: web
    environment:
      BRAIN_API_URL: http://api:8000
      LOCAL_BEARER_TOKEN: ${LOCAL_BEARER_TOKEN:-brain-local-dev}
      LOCAL_WEB_USER: ${LOCAL_WEB_USER:-brain-admin}
      LOCAL_WEB_PASSWORD: ${LOCAL_WEB_PASSWORD:-brain-local-dev}
      LOCAL_WEB_SESSION_SECRET: ${LOCAL_WEB_SESSION_SECRET:-brain-local-session-secret}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/sign-in').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 2s
      timeout: 5s
      retries: 15

  migrate:
    build:
      context: .
      dockerfile: products/brain/Dockerfile
      target: api
    command: ["alembic", "-c", "products/brain/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://brain:brain@postgres:5432/brain
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  cortex-api:
    build:
      context: .
      dockerfile: products/cortex/Dockerfile
      target: api
    ports:
      - "${CORTEX_API_PORT:-8100}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 15

  cortex-web:
    build:
      context: .
      dockerfile: products/cortex/Dockerfile
      target: web
    ports:
      - "${CORTEX_WEB_PORT:-3100}:3000"
    depends_on:
      cortex-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  brain-postgres-data:
