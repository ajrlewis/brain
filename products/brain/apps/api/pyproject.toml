[project]
name = "brain-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "brain-auth",
  "brain-core",
  "brain-db",
  "brain-mcp",
  "brain-schemas",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
brain-api = "brain_api.main:run"

[tool.uv.sources]
brain-auth = { workspace = true }
brain-core = { workspace = true }
brain-db = { workspace = true }
brain-mcp = { workspace = true }
brain-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
