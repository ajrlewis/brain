[project]
name = "brain-db"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<2",
  "brain-ai",
  "brain-search",
  "brain-schemas",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "pgvector>=0.4,<1",
]

[tool.uv.sources]
brain-schemas = { workspace = true }
brain-ai = { workspace = true }
brain-search = { workspace = true }

[project.scripts]
brain-seed-northstar = "brain_db.seed:run"
brain-seed-defaults = "brain_db.defaults:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
