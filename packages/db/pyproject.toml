[project]
name = "brain-db"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "pgvector>=0.4,<1",
]

[project.scripts]
brain-seed-northstar = "brain_db.seed:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
