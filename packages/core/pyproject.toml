[project]
name = "brain-core"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "brain-auth",
  "brain-db",
  "brain-schemas",
  "pydantic-settings>=2.10,<3",
]

[tool.uv.sources]
brain-auth = { workspace = true }
brain-db = { workspace = true }
brain-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
