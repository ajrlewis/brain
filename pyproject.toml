[project]
name = "mind-workspace"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pyright>=1.1.405,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["products/*/apps/*", "products/*/packages/*", "packages/*"]
exclude = ["products/*/apps/web"]

[tool.uv.sources]
brain-ai = { workspace = true }
brain-api = { workspace = true }
brain-auth = { workspace = true }
brain-core = { workspace = true }
brain-db = { workspace = true }
brain-mcp = { workspace = true }
brain-schemas = { workspace = true }
brain-search = { workspace = true }
cortex-api = { workspace = true }
cortex-ai = { workspace = true }
cortex-brain = { workspace = true }

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["products/*/apps/*/src", "products/*/packages/*/src", "packages/*/src", "products/*/tests"]
extend-exclude = ["README.md", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["products/*/apps", "products/*/packages", "products/*/tests"]
exclude = ["**/__pycache__", "products/brain/packages/db/hatch_build.py"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["products/*/tests"]
markers = [
  "integration: requires local infrastructure",
  "e2e: exercises a runnable application boundary",
]

[tool.coverage.run]
branch = true
source = ["brain_api", "brain_auth", "brain_core", "brain_db", "brain_mcp", "brain_schemas", "cortex_ai", "cortex_api", "cortex_brain"]
omit = [
  "products/brain/packages/db/src/brain_db/defaults.py",
  "products/brain/packages/db/src/brain_db/seed.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
