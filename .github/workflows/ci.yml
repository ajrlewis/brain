name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: brain
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: brain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brain -d brain"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://brain:brain@localhost:5432/brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.6"
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: psql "$TEST_DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS vector"
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
